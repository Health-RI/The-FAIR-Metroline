<div class="use-case-cards-grid">
  {% for section in include.sections %}
  <a href="#{{ section.anchor }}" class="use-case-card">
    <div class="use-case-card-icon">{{ section.icon }}</div>
    <h3 class="use-case-card-title">{{ section.name }}</h3>
    <p class="use-case-card-description">{{ section.description }}</p>
  </a>
  {% endfor %}
</div>
