{%- assign p = include.p -%}{%- assign pf = p.pending_fields -%}
{%- if p.keywords -%}
<section class="tp-section">
  <h2>Keywords</h2>
  <div class="tp-keywords{% if pf contains 'keywords' %} tp-pending{% endif %}">
    {% for k in p.keywords %}
    {% assign kw = site.data.keywords | where: "name", k | first %}
    {% if kw.url %}<a class="tp-keyword tp-keyword--std" href="{{ kw.url }}" target="_blank" rel="noopener" title="{{ kw.text }}">{{ k }}</a>{% else %}<span class="tp-keyword">{{ k }}</span>{% endif %}
    {% endfor %}
  </div>
</section>
{%- endif -%}
