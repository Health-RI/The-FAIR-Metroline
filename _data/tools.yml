  at_a_glance:
    Tool name: DMPonline
    Short description: Web-based tool for creating, reviewing, and sharing Data Management Plans (DMPs) that meet institutional and funder requirements.
    Purpose and core functionality: DMPonline is a web-based Data Management Planning (DMP) tool developed and maintained by the Digital Curation Centre (DCC) in partnership with the University of California Curation Center (UC3). It helps researchers create, review, and share Data Management Plans that comply with requirements from institutions and research funders. The tool provides the latest funder templates, tailored guidance, and example answers. Users can collaborate on plans, browse publicly shared DMPs for inspiration, and export plans in multiple formats. DMPonline is free to use for all researchers and is hosted by subscribing institutions and universities worldwide, with over 177,000 users across 804 organisations in 89 countries.
    Type: Data Management Planning
    FAIR support category: Planning & assessment
