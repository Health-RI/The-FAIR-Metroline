    - fair-in-a-box
    - castor
  biotools_id:

- id: fair-in-a-box
  page_img_url: https://github.com/ejp-rd-vp.png?size=200
  at_a_glance:
    Tool name: FAIR-in-a-box
    Short description: Automated FAIRification workflow for transforming structured data into RDF and publishing it with FAIR metadata.
    Purpose and core functionality: FAIR-in-a-box is an automated tool for making data FAIR by transforming CSV data into RDF, commonly using the CARE-SM model for healthcare and registry information. The workflow can connect transformed RDF to a triplestore and FAIR Data Point, and can be customised by adapting scripts and YARRRML mappings for other semantic models.
    Type: FAIRification workflow
    FAIR support category: Semantics & validation
    Life cycle phases:
      - Process
      - Preserve
      - Share
    Domains using it:
      - Health
      - Rare diseases
    Website:
