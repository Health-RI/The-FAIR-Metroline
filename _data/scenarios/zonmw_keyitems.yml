- title: "Key item 3. terms of use"
  status: "active"
  icon: ""
  description: "<b>Hints</b><br>
              Open licence (e.g., CC BY 4.0), Data Use Agreement, access after approval by a Data Access Committee (DAC), informed consent for secondary use, federated access, or analysis only within a Secure Data Environment.
              <br>
              <b>Relevant FAIR Metroline pages</b>
              <ul>
                 <li><a href='https://fairmetroline.org/metroline_steps/define_access_conditions'><b>Define access conditions.</b></a> Define and document the conditions under which data can be accessed and reused, including access levels, policies, licences and agreements, ensuring compliance with legal, ethical and FAIR requirements.</li>
                 <li><a href='https://fairmetroline.org/metroline_steps/obtain_informed_consent'><b>Obtain informed consent.</b></a> Design informed consent materials that enable ethical, legal and FAIR-compliant data collection, sharing and reuse.</li>
              </ul>"
