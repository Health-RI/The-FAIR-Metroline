- title: "Key item 1. making data findable with a persistent identifier"
  status: "active"
  icon: ""
  description: "
                <b>Persistent Identifier (PID)</b><br>
                A Persistent Identifier (PID) is a long-lasting, globally unique identifier for a digital object such as a dataset, software package, biomaterial collection, publication or metadata record. Unlike a regular URL, a PID remains stable even when the location of the resource changes. PIDs help researchers, funders, and machines reliably find and cite research outputs. Common examples include DOI and ORCID. A PID should lead to a webpage (landing page) describing the resource.
                <br><br>
                <b>RESOURCES</b>
                <ul>
                  <li><a href='https://fairmetroline.org/metroline_steps/select_identifier_scheme'><b>Select identifier scheme.</b></a> Understand how to select, use and manage identifier schemes to ensure that data and metadata are uniquely identifiable, persistent and interoperable.</li>
                  <li><a href='https://fairmetroline.org/metroline_steps/register_resource_level_metadata'><b>Register resource level metadata.</b></a> Make resources findable by selecting appropriate metadata catalogues and registering consistent, well-defined resource-level metadata.</li>
                  <li><a href='https://fairmetroline.org/scenarios/make_dataset_findable'><b>Use case: How to make my dataset Findable?</b></a></li>
                  <li><a href='https://www.doi.org/the-identifier/what-is-a-doi/'><b>doi.org</b></a> Learn about digital ojbect identifiers.</li> 
                  <li><a href='https://www.go-fair.org/fair-principles/f1-meta-data-assigned-globally-unique-persistent-identifiers/'><b>The GO FAIR website.</b></a> Read about FAIR principle F1: (Meta) data are assigned globally unique and persistent identifiers.</li>
                </ul>
                "
  examples:
    - role: "1.2"
      description: "The dataset has been deposited in Zenodo and assigned DOI https://doi.org/10.5281/zenodo.1234567"
    - role: "1.3"
      description: "The DOI has been added to the products section of Mijn ZonMw and refers to the dataset deposited in Zenodo."
    - role: "1.4"
      description: "For example, during a progress report: indicate which repository will assign one at the end of the project.<br>A DOI is not yet available because publication is planned after project completion. The dataset can currently be found through the institutional catalogue at the URL https://umcgresearchdatacatalogue.nl or DOI doi.org/10.00001/123456789"



- title: "Key item 2. making data findable via a data platform or repository"
  status: "active"
  icon: ""
  description: "<b>Hints</b><br>
              Publication in a repository such as Zenodo, DataverseNL, or an institutional repository. For sensitive health data, only metadata may be publicly available, while access to the data is provided under controlled conditions
              <br>
              <b>Relevant FAIR Metroline pages</b>
              <ul>
                 <li><a href='https://fairmetroline.org/scenarios/make_dataset_findable'><b>Use case: How to make my dataset Findable?</b></a></li>
                 <li><a href='https://fairmetroline.org/metroline_steps/assess_availability_of_your_metadata'><b>Assess availability of your metadata.</b></a> Identify, evaluate and improve the completeness and quality of their metadata to ensure it is accurate, consistent and ready for reuse and publication.</li>
                 <li><a href='https://fairmetroline.org/metroline_steps/define_access_conditions'><b>Define access conditions.</b></a> Define and document the conditions under which data can be accessed and reused, including access levels, policies, licences and agreements, ensuring compliance with legal, ethical and FAIR requirements.</li>                                  
                 <li><a href='https://fairmetroline.org/metroline_steps/register_resource_level_metadata'><b>Register resource level metadata.</b></a> Make resources findable by selecting appropriate metadata catalogues and registering consistent, well-defined resource-level metadata.</li>
