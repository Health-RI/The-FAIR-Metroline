- title: "Key item 4. standards"
  status: "active"
  icon: ""
  description: "<b>Hints</b><br>
              Terminologies such as SNOMED CT, LOINC, ICD-10, or ATC ; data models such as OMOP CDM, HL7 FHIR, openEHR or CDISC; file formats such as CSV, JSON, DICOM, FASTQ, BAM or VCF; ontologies such as human phenotype ontology (HPO), gene ontology (GO)
              <br>
              <b>Relevant FAIR Metroline pages</b>
              <ul>
                 <li><a href='https://fairmetroline.org/metroline_steps/analyse_data_semantics'><b>Analyse data semantics.</b></a> Clarify and define the meaning of their data and metadata elements by identifying ambiguities and creating a clear, unambiguous codebook to support further FAIRification steps.</li>
                 <li><a href='https://fairmetroline.org/metroline_steps/apply_common_data_elements'><b>Apply common data elements.</b></a> Identify, select and apply common data elements to standardise data collection and improve interoperability, data quality and reuse.</li>
                 <li><a href='https://fairmetroline.org/metroline_steps/creating_a_fair_implementation_profile'><b>Creating a FIP.</b></a> Define and document a FAIR Implementation Profile by selecting the community-agreed standards, tools and resources used to implement the FAIR principles.</li>
                 <li><a href='https://fairmetroline.org/metroline_steps/create_or_reuse_a_semantic_model'><b>Create or reuse a semantic (meta)data model.</b></a> Decide whether to reuse, extend or create a semantic model for your data or metadata so it can be represented in a structured, machine-readable and interoperable way.</li>
                 <li><a href='https://fairmetroline.org/metroline_steps/use_ontologies_in_the_model'><b>Use ontologies in the model.</b></a> Link elements in a semantic model to ontology terms so their meanings become explicit, machine understandable and interoperable across systems.</li>
              </ul>"
