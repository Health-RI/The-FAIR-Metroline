- status: "prerequisite"
  text: "You know what you want to achieve: your FAIRification objectives are clear."
  step_ids:
    - 1

- status: "prerequisite"
  text: "A FAIR data steward can help you when needed."
  step_ids:
    - 3

- status: "prerequisite"
  text: "Your team has followed training where its knowledge has gaps."
  step_ids:
    - 4

- title: "Choose a suitable catalogue and check how to register your dataset"
  status: "upcoming"
  description: "
      <ol>
        <li>Identify a suitable metadata catalogue, considering institutional requirements and relevant catalogues in your research domain.</li> 
        <li>Check the catalogue's metadata requirements and how datasets are registered.</li>
        <li>Check how metadata are submitted to the catalogue, either directly or through a service such as a FAIR Data Point (FDP), and who can help with or handle the publication.</li>
      </ol>
  "
  step_ids:
    - 10
  examples:
    - role: "Researcher"
      description: "I contact the Radboud Technology Center Data Stewardship for support. Together, we check that a local FDP is available and uses the Health-RI Core Metadata schema required for publication to the National Health Data Catalogue."

- title: "Prepare the metadata for your chosen catalogue"
  status: "upcoming"
  description: "
      <ol>
        <li>Identify what metadata are already available about your dataset and assess their completeness and quality.</li> 
        <li>Complete any missing information and align the metadata with the requirements of your chosen catalogue.</li>
        <li>Determine or confirm the conditions under which the data can be accessed and reused. Document these conditions in the metadata, including any restrictions and information on how access can be requested.</li>
      </ol>
  "
  step_ids:
    - 10
    - 8
    - 21
  examples:
    - role: "Researcher"
      description: "Together with my data steward, I check which metadata are already available and what information is still missing. I complete the Health-RI metadata template, including the required information about how my dataset can be accessed."

- title: "Register and publish the metadata"
  status: "upcoming"
  description: "
      <ol>
        <li>Submit the prepared metadata to your chosen catalogue, either directly or through the appropriate institutional publication service.</li>
        <li>If necessary, work with technical support to ensure the metadata are published in the required format.</li>
        <li>Verify that your dataset can be found in the catalogue and that the published information, including access conditions, is correct and complete.</li>
      </ol>
  "
  step_ids:
    - 10
    - 20
  examples:
    - role: "Researcher"
      description: "The data steward enters my dataset's metadata through the FDP user interface, where they are published and made discoverable through the National Health Data Catalogue."

- title: "Your dataset is now findable in a catalogue"
  status: "destination"
  description: "Your dataset is discoverable through its published metadata. Other researchers can find information about the dataset, assess its relevance and determine how it may be accessed."
  examples:
    - role: "Researcher"
      description: "My dataset's metadata are published through the FDP and are now findable in the National Health Data Catalogue."
