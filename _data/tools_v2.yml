- id: erdri-mdr
  name: ERDRI.mdr
  short_description: European Commission repository where rare disease registries publish their data element definitions, so others can look them up and reuse them.
  description: >-
    ERDRI.mdr is the Central Metadata Repository of the European Rare Disease Registry Infrastructure (ERDRI),
    run by the European Commission's Joint Research Centre. It stores the data elements used by participating
    rare disease registries, with their names and definitions; each registry uploads its data elements as an
    Excel file, and every upload becomes a new numbered version. Anyone can browse it read-only, with limited
    detail, without an account; verified registry users can add their registry's data elements, and people
    setting up or changing a registry can select existing data elements to reuse.
  tool_type: [Registry / catalogue]
  fair: [F, I]
