- id: mydre
  name: myDRE
  short_description: "Secure cloud workspaces where project teams store and analyse sensitive data, with approved and logged upload and download; used by Dutch UMCs."
  description: >-
    myDRE is a Trusted Processing Environment run by anDREa B.V. on Microsoft Azure. An organisation
    takes a subscription and creates a workspace per research project; each workspace has its own
    storage and Windows or Linux virtual machines, on which researchers use the software they need
    (organisations can provide machine templates with, for example, Python, R and SPSS). Access is
    role-based and can include collaborators from other organisations, every action is logged, and data
    can only enter or leave a workspace through an approval step. Costs are the organisation's
    subscription plus pay-per-use Azure consumption. myDRE is used by Dutch UMCs, for example to analyse
    sensitive health data or to run nodes for federated analysis.
  tool_type: [Web application, Workbench, Web API, Web service]
  fair: [A]
  lifecycle: [Process, Analyse]
  domains: [Cross-domain]
  license: [Proprietary]
  cost: Institutional licence
  code_availability: [Closed source]
  hosted: true
  links:
    homepage: "https://andrea-cloud.com/mydre"
    homepage_opens_tool: false
    docs: "https://support.mydre.org/portal/en/kb/mydre"
