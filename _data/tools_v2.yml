- id: fairdom-seek
  name: FAIRDOM-SEEK
  short_description: "Web platform, self-hosted or used via FAIRDOMHub, to catalogue, share and publish data, models and SOPs organised as investigations, studies and assays."
  description: >-
    FAIRDOM-SEEK is a web-based platform for cataloguing, sharing and publishing research data, models,
    simulations, processes and outcomes. It uses an ISA-style structure for investigations, studies and
    assays, supports permissions and publication workflows, and can be used as the basis for project or
    community hubs such as the IBISBA Knowledge Hub. In this scenario, it is the destination where the
    structured experiment, metadata, files and related outputs are registered for controlled sharing and
    reuse.
