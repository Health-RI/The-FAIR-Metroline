- id: icrf-generator
  name: iCRF Generator
  short_description: Desktop tool that generates eCRFs for Castor EDC, REDCap and other EDC systems from items in online codebooks such as ART-DECOR.
  description: >-
    The iCRF Generator is an open-source Java desktop application, developed at Amsterdam UMC, with a wizard
    in which you pick items from published online codebooks, such as the Dutch Clinical Building Blocks (zibs),
    the Basic Health Data Set and the VASCA rare disease codebook in ART-DECOR. It writes these items as eCRF
    definitions for Castor EDC, REDCap, OpenClinica 3 / LibreClinica, MOLGENIS EMX or CDISC ODM-XML, and keeps
    the terminology codes (for example SNOMED CT) that the codebook already contains. Sections, repeating
    groups and other study-specific details are added afterwards in the EDC system. Support for openEHR
    codebooks is currently not working; see the GitHub README.
  tool_type: [Desktop application]   # bio.tools record says Command-line tool, Script, which is wrong (it is a GUI wizard)
  fair: [I, R]
  lifecycle: [Collect]
  domains: [Clinical medicine, Health sciences]
  links:
    homepage: https://www.healthdata.nl/en/services/icrf-generator
  keywords: [eCRF, codebook, CDISC ODM]
  ids:
    biotools: icrf_generator
    github: aderidder/iCRFGenerator
  related: [art-decor, castor, redcap, codebook-to-castor-limesurvey]

