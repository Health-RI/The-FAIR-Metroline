# DEMO: compact tool entries (schema: _schemas/tool.schema.yml), rendered with _layouts/tool_compact.html.
# An entry here overrides the matching id in _data/tools.yml.
#
# kind — what the reader does with it:
#   document  = you read it or fill it in (checklist, questionnaire, spreadsheet, standard, maturity model)
#   catalogue = you look things up or register things in it (registry, catalogue, metadata repository)
#   service   = you log in to something someone else runs (account or licence)
#   software  = you install or run it yourself
# Licence, release activity and citation are fetched from ids.biotools / ids.github at build time.
# Metroline steps are derived from the step pages that mention the tool.

- id: robot
  kind: software
  name: ROBOT
  description: Command-line toolkit to build, check and release ontologies.
  fair_support_category: Semantics & validation
  links:
    homepage: https://robot.obolibrary.org/
    docs: https://robot.obolibrary.org/
  ids:
    biotools: robot
    github: ontodev/robot
  related: [protege, sssom-toolkit]

- id: castor
  kind: service
  name: Castor EDC
  description: Cloud-based electronic data capture for clinical studies; most Dutch UMCs hold a licence.
  fair_support_category: Capture & collection
  access: institutional licence
  links:
    homepage: https://www.castoredc.com/
    docs: https://helpdesk.castoredc.com/
  note: Suitable for personal data under your institute's processing agreement.   # verify
  institutes: [Amsterdam UMC, Erasmus MC, Leiden UMC, Maastricht UMC+, Radboudumc, UMCG]
  related: [redcap, icrf-generator, codebook-to-castor-limesurvey]

- id: fairassist
  kind: catalogue
  name: FAIRassist
  description: Overview of FAIR assessment tools and metrics, to help you choose an assessment approach.
  fair_support_category: Planning & assessment
  access: free
  links:
    homepage: https://fairassist.org/
  related: [fair-evaluator, fair-checker, fair-aware]

- id: fair-aware
  kind: document
  name: FAIR Aware
  description: Short online questionnaire that tests how well you know the FAIR principles before you deposit data.
  fair_support_category: Planning & assessment
  access: free
  links:
    homepage: https://fairaware.dans.knaw.nl/
  ids:
    github: FAIRsFAIR/fair-aware

- id: csv-on-the-web
  kind: document
  name: CSV on the Web
  description: W3C standard for describing the columns and meaning of CSV files in machine-readable metadata.
  fair_support_category: Capture & collection
  access: free
  links:
    homepage: https://csvw.org/
    docs: https://www.w3.org/TR/tabular-data-primer/
