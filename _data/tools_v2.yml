- id: fair-data-point
  name: FAIR Data Point
  short_description: "Server software that publishes metadata about your catalogues, datasets and distributions as DCAT-based RDF, so people and machines can find it."
  description: >-
    A FAIR Data Point (FDP) exposes metadata according to the FAIR principles. The reference
    implementation exposes metadata using DCAT and related RDF vocabularies includes DCAT-based metadata
    layers and can be customised with SHACL shapes, for example to align metadata with the Health-RI
    metadata schema and expose it to catalogues such as the National Health Data Catalogue.
