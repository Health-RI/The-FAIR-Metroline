  short_description: Browser component, added to a website, that lets users query a knowledge graph by picking classes and properties instead of writing SPARQL.
  tool_type: [Plug-in]   # not in bio.tools; biotoolsSchema files JavaScript widgets under Plug-in
  fair: [I]
  domains: [Cross-domain]
  links:
    homepage: https://sparnatural.eu/
    docs: https://docs.sparnatural.eu/
  keywords: [SPARQL, RDF, SHACL]   # SHACL: the component is configured with SHACL shapes
  ids:
    github: sparna-git/Sparnatural
  related: [wikidata-query-builder, yasgui, graphdb]

- id: wikidata-query-builder
  name: Wikidata Query Builder
  short_description: Web form for simple queries over Wikidata; you pick properties and values, and it writes and runs the SPARQL query for you.
  tool_type: [Web application]   # not in bio.tools on its own (only Wikidata itself is)
  fair: [I]
  domains: [Cross-domain]
  links:
    homepage: https://query.wikidata.org/querybuilder/
    docs: https://www.wikidata.org/wiki/Wikidata:Query_Builder
  keywords: [SPARQL]
  ids:
    github: wikimedia/wikidata-query-builder   # GitHub mirror of the Wikimedia Gerrit repository
  related: [sparnatural, yasgui]

- id: yasgui
