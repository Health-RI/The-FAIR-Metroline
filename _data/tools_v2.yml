- id: molgenis
  name: MOLGENIS
  short_description: "Open-source platform that turns your data model into a web database, registry or data catalogue, with ontology annotations and RDF output."
  description: >-
    MOLGENIS is open-source software, coordinated by the Genomics Coordination Center at UMCG, for
    building research databases. You describe your data as a model of tables, columns and relationships,
    and MOLGENIS generates a web application with data-entry forms, upload and download, search and
    access permissions. The current version, MOLGENIS EMX2, adds GraphQL and RDF interfaces and lets you
    annotate tables and columns with ontology terms; its data catalogue model follows DCAT and the
    Health-RI core metadata schema. MOLGENIS is used for patient registries and for cohort and biobank
    catalogues such as the European Health Research Data and Sample Catalogue, and, through MOLGENIS
    Armadillo, for federated analysis with DataSHIELD.
  tool_type: [Web application, Workbench, Web API, Web service, Suite, Registry / catalogue, Database portal]
  fair: [F, I]
  lifecycle: [Collect, Analyse, Share, Reuse]
  domains: ["Patient registries & rare diseases", Omics, Clinical research, Oncology, Life sciences]
  license: [LGPL-3.0]
  cost: Free of charge
  code_availability: [Open source]
