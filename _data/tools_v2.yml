- id: fair-in-a-box
  name: FAIR-in-a-box
  short_description: Docker bundle that converts CARE-SM CSV files to RDF in GraphDB and describes them in a FAIR Data Point; deprecated, use the Sextans Suite.
  description: >-
    FAIR-in-a-box (FiaB) is a Docker Compose bundle from the EJP RD Virtual Platform. It converts CSV
    files laid out according to the Clinical and Registry Entries Semantic Model (CARE-SM) into RDF
    using YARRRML templates, loads the RDF into GraphDB and describes the data in a FAIR Data Point.
    The YARRRML mappings can be adapted to other semantic models. FiaB is deprecated: it no longer
    receives security patches, and its maintainers direct users to the Sextans Suite (Sextans Sight
    for FAIR Data Point metadata, Sextans Fix for CARE-SM data transformation).
  tool_type: [Workflow, Suite]   # not in bio.tools
  fair: [F, I]
  domains: [Clinical medicine, Health sciences]
  deprecated: true   # maintainers point to the Sextans Suite
  links:
    homepage: https://github.com/ejp-rd-vp/FiaB
  keywords: [CSV, RDF, CARE-SM]
  ids:
