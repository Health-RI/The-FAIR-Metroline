- id: fair-data-station
  name: FAIR Data Station
  short_description: "Web application to record ISA-structured study metadata in Excel templates, validate it against community checklists and convert it to RDF."
  description: >-
    FAIR Data Station is an open-source web application developed at Wageningen University & Research as
    part of FAIR by Design. Its Metadata Configurator builds Excel metadata templates for the ISA levels
    investigation, study, observation unit, sample and assay, drawing on community checklists such as
    those of ENA and MIxS. The Station validates filled-in templates and converts valid metadata to RDF
    for downstream processing. It can also generate ENA submission files, import existing ENA
    BioProjects, connect to iRODS/Yoda and be used through a REST API. A public instance runs at
    fairds.fairbydesign.nl, and you can also run your own.
  tool_type: [Web application, Web API, Web service, Workbench]
  fair: [F, I, R]
  lifecycle: [Plan, Collect, Process, Share]
  domains: [Life sciences, Omics]
  license: [MIT]
