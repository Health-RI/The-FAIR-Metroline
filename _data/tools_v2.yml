- id: mydre
  name: myDRE
  short_description: Secure cloud workspaces where project teams store and analyse sensitive data, with approved and logged upload and download; used by all Dutch UMCs.
  description: >-
    myDRE is a Trusted Processing Environment run by anDREa B.V. on Microsoft Azure. An organisation
    takes a subscription and creates a workspace per research project; each workspace has its own
    storage and Windows or Linux virtual machines, on which researchers use the software they need
    (organisations can provide machine templates with, for example, Python, R and SPSS). Access is
    role-based and can include collaborators from other organisations, every action is logged, and
    data can only enter or leave a workspace through an approval step. Costs are the organisation's
    subscription plus pay-per-use Azure consumption. myDRE is used by all Dutch UMCs, for example to
    analyse sensitive health data or to run nodes for federated analysis.
  tool_type: [Web application]
  fair: [A]
  domains: [Cross-domain]
  cost: Commercial
  access: Restricted access
  links:
    homepage: https://andrea-cloud.com/mydre
    docs: https://support.mydre.org/portal/en/kb/mydre
  related: [castor, surf-filesender]

- id: molgenis
  name: MOLGENIS
  short_description: Open-source platform that turns your data model into a web database, registry or data catalogue, with ontology annotations and RDF output.
  description: >-
    MOLGENIS is open-source software, coordinated by the Genomics Coordination Center at UMCG, for
    building research databases. You describe your data as a model of tables, columns and
    relationships, and MOLGENIS generates a web application with data-entry forms, upload and
    download, search and access permissions. The current version, MOLGENIS EMX2, adds GraphQL and RDF
    interfaces and lets you annotate tables and columns with ontology terms; its data catalogue model
    follows DCAT and the Health-RI core metadata schema. MOLGENIS is used for patient registries and
    for cohort and biobank catalogues such as the European Health Research Data and Sample Catalogue,
    and, through MOLGENIS Armadillo, for federated analysis with DataSHIELD.
  fair: [F, I]
  domains: [Clinical medicine, Health sciences]
  links:
    homepage: https://molgenis.org/
    docs: https://molgenis.github.io/molgenis-emx2/
  keywords: [RDF, DCAT]
  ids:
    biotools: molgenis
    github: molgenis/molgenis-emx2
  institutes: [UMCG]
  related: [fair-data-point, fair-in-a-box, fairdom-seek]

