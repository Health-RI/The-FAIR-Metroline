- id: leaf
  name: LEAF
  short_description: "Open-source framework whose adapters collect data and metadata automatically from lab equipment, such as bioreactors, and stream them via MQTT."
  description: >-
    LEAF (Lightweight Equipment Adapter Framework) is open-source software from Wageningen University &
    Research for collecting data and metadata directly from research equipment such as bioreactors and
    other lab instruments. For each type of equipment an adapter reads the manufacturer's output,
    converts it into one common structure (InfluxDB line protocol by default) and sends it via MQTT to
    an endpoint you choose, so data are available while an experiment runs instead of being exported by
    hand afterwards. LEAF is installed as a desktop app or as a Python package, and ready-made adapters
    are listed in an online marketplace. The optional OAK backend (MQTT broker, time-series database and
    Grafana dashboards) can be run yourself or as a managed service.
  tool_type: [Web application, Workbench, Database portal]
  fair: [I]
  lifecycle: [Collect, Process]
  domains: [Clinical research]
  license: [MPL-2.0]
  cost: Free of charge
  code_availability: [Open source]
  links:
