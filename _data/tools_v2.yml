  tool_type: [Web application, Plug-in]   # not in bio.tools; public editor plus an embeddable JavaScript widget (Plug-in, as for Sparnatural)
  fair: [I]
  domains: [Cross-domain]
  links:
    homepage: https://yasgui.triply.cc/
    docs: https://github.com/rdfjs/Yasgui/blob/main/README.md   # docs.triply.cc/yasgui is gone (404)
  keywords: [SPARQL, RDF]
  ids:
    github: rdfjs/Yasgui   # TriplyDB/Yasgui was archived on 2026-04-20; development continues here
  related: [virtuoso-query-editor, sparnatural, wikidata-query-builder]

