- id: dmponline
  name: DMPonline
  short_description: "Free web tool from the Digital Curation Centre for writing, sharing and reviewing data management plans with funder and institutional templates."
  description: >-
    DMPonline is a web tool for writing data management plans (DMPs), run by the Digital Curation Centre
    (DCC) at the University of Edinburgh. After you answer a few questions about your funder and
    organisation, it shows the matching template, with guidance and example answers from funders and
    institutions. You can write a plan with collaborators, share it for feedback, publish it as a public
    DMP and export it in several formats. DMPonline is free for all researchers; subscribing
    organisations, including several Dutch universities and UMCs, add their own templates, guidance and
    branding and can harvest plans through an API that follows the RDA DMP Common Standard. It runs on
    the open-source DMPRoadmap software, developed jointly by the DCC and the University of California
    Curation Center (UC3).
  tool_type: [Web application, Web API, Web service]
