- id: dmponline
  name: DMPonline
  short_description: Free web tool from the Digital Curation Centre for writing, sharing and reviewing data management plans with funder and institutional templates.
  description: >-
    DMPonline is a web tool for writing data management plans (DMPs), run by the Digital Curation
    Centre (DCC) at the University of Edinburgh. After you answer a few questions about your funder
    and organisation, it shows the matching template, with guidance and example answers from funders
    and institutions. You can write a plan with collaborators, share it for feedback, publish it as a
    public DMP and export it in several formats. DMPonline is free for all researchers; subscribing
    organisations, including several Dutch universities and UMCs, add their own templates, guidance
    and branding and can harvest plans through an API that follows the RDA DMP Common Standard. It
    runs on the open-source DMPRoadmap software, developed jointly by the DCC and the University of
    California Curation Center (UC3).
  tool_type: [Web application]
  fair: [planning]
  domains: [Cross-domain]
  cost: Free of charge
  access: Open access
  links:
    homepage: https://dmponline.dcc.ac.uk/
    docs: https://dmponline.dcc.ac.uk/help
  keywords: [RDA DMP Common Standard]
  ids:
    github: DMPRoadmap/roadmap
  institutes: [Leiden UMC, Radboudumc, Vrije Universiteit Amsterdam, UMC Utrecht, Wageningen University & Research, Universiteit Utrecht, Technische Universiteit Delft, Erasmus Universiteit Rotterdam]
  related: [fip-wizard, fair-aware]

- id: leaf
  name: LEAF
  short_description: Open-source framework whose adapters collect data and metadata automatically from lab equipment, such as bioreactors, and stream them via MQTT.
  description: >-
    LEAF (Lightweight Equipment Adapter Framework) is open-source software from
    Wageningen University & Research for collecting data and metadata directly from research
    equipment such as bioreactors and other lab instruments. For each type of equipment an adapter
    reads the manufacturer's output, converts it into one common structure (InfluxDB line protocol by
    default) and sends it via MQTT to an endpoint you choose, so data are available while an
    experiment runs instead of being exported by hand afterwards. LEAF is installed as a desktop app or
    as a Python package, and ready-made adapters are listed in an online marketplace. The optional OAK
    backend (MQTT broker, time-series database and Grafana dashboards) can be run yourself or as a
    managed service.
  tool_type: [Desktop application, Library]
  fair: [R]
  domains: [Industrial biotechnology, Biological sciences]
  cost: Free of charge
  access: Open access
  links:
    homepage: https://leaf-framework.org/
    docs: https://leaf-framework.org/docs/
    download: https://leaf-framework.org/download/
  keywords: [MQTT]
  institutes: [Wageningen University & Research]
  related: [fair-data-station, fairdom-seek]

- id: fair-data-station
  name: FAIR Data Station
  short_description: Web application to record ISA-structured study metadata in Excel templates, validate it against community checklists and convert it to RDF.
  description: >-
    FAIR Data Station is an open-source web application developed at Wageningen University & Research
    as part of FAIR by Design. Its Metadata Configurator builds Excel metadata templates for the ISA
    levels investigation, study, observation unit, sample and assay, drawing on community checklists
    such as those of ENA and MIxS. The Station validates filled-in templates and converts valid
    metadata to RDF for downstream processing. It can also generate ENA submission files, import
    existing ENA BioProjects, connect to iRODS/Yoda and be used through a REST API. A public instance
    runs at fairds.fairbydesign.nl, and you can also run your own.
  fair: [I, R]
  domains: [Biological sciences, Industrial biotechnology]
  links:
    homepage: https://fairbydesign.nl/
    docs: https://fairbydesign.nl/docs/fairdatastation/introduction/
    download: https://gitlab.com/fairbydesign/fairds/-/releases   # bio.tools download link is broken
  keywords: [RDF, ISA]
  ids:
    biotools: fair_data_station
    rsd: fair-data-station
  institutes: [Wageningen University & Research]
  related: [fairdom-seek, leaf, cedar-workbench]

