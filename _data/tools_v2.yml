- id: xnat
  name: XNAT
  short_description: "Open-source platform to archive, search and share medical imaging data such as DICOM scans, with project-based access control."
  description: >-
    XNAT is an open-source imaging informatics platform designed to support imaging-based research. It
    offers tools to import, archive, describe, search and securely distribute imaging and related study
    data. In a FAIR workflow, XNAT can support findability and accessibility by preserving imaging
    metadata, making imaging datasets searchable, managing controlled access and exporting image dataset
