# DRAFT — schema for one tool entry (JSON Schema 2020-12, written as YAML).
# Demo data: _data/tools_v2.yml. Rendered by _layouts/tool_profile.html.
#
# Curate only what no registry knows. Everything else is:
#   fetched  from bio.tools / GitHub (tool type, licence, cost, access, maturity, activity, citation, metrics)
#   reused   from the tool's existing entry in _data/tools.yml (purpose text, manuals, training,
#            templates, standards, life cycle phases)
#   derived  by the site (Metroline steps from the step pages; scenarios through those steps)
# A local value always wins over a fetched or reused one.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://fairmetroline.org/schemas/tool.schema.json
title: FAIR Metroline tool entry
type: object
additionalProperties: false
required: [id, name, short_description, fair, domains, links]

properties:
  id:
    description: Stable slug used by the show-badges / show-tiles includes. Never rename.
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"

  name: {type: string}

  logo:
    description: Path under assets/img/ or an absolute URL. Defaults to the logo in _data/tools.yml.
    type: string

  short_description:
    description: One sentence; shown in the header, badges and tiles.
    type: string
    maxLength: 160

  description:
    description: Optional About paragraph. Defaults to "Purpose and core functionality" in _data/tools.yml.
    type: string

  tool_type:
    description: >
      bio.tools toolType values. For tools in bio.tools this is fetched, so set it only when the
      bio.tools record is empty or wrong. For resources bio.tools does not register, use one of the
      local types. Vocabulary with definitions: _data/tool_types.yml.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        # biotoolsSchema toolType
        - Bioinformatics portal
        - Command-line tool
        - Database portal
        - Desktop application
        - Library
        - Mobile application
        - Ontology
        - Plug-in
        - Script
        - SPARQL endpoint
        - Suite
        - Web application
        - Web API
        - Web service
        - Workbench
        - Workflow
        # local, for resources outside bio.tools
        - Self-assessment / checklist
        - Registry / catalogue
        - Standard / specification

  fair:
    description: >
      FAIR tags at letter level: which of Findable, Accessible, Interoperable, Reusable the resource
      helps with, and/or "planning" for FAIR assessment and planning resources.
    type: array
    minItems: 1
    uniqueItems: true
    items: {enum: [F, A, I, R, planning]}

  lifecycle:
    description: Optional; defaults to "Life cycle phases" in _data/tools.yml.
    type: array
    uniqueItems: true
    items: {enum: [Plan, Collect, Process, Analyse, Preserve, Share, Reuse]}

  domains:
    description: NWO research fields (second level, _data/research_fields.yml), or Cross-domain on its own.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum:
        - Cross-domain
        - Mathematics
        - Computer and information sciences
        - Physical sciences
        - Chemical sciences
        - Earth and related environmental sciences
        - Biological sciences
        - Astronomy, Astrophysics
        - Civil engineering
        - Electrical engineering, electronic engineering, information engineering
        - Mechanical engineering
        - Chemical engineering
        - Materials engineering
        - Medical engineering
        - Environmental engineering
        - Environmental biotechnology
        - Industrial biotechnology
        - Nanotechnology
        - Design Engineering
        - Basic medicine
        - Clinical medicine
        - Health sciences
        - Medical biotechnology
        - Other medical sciences
        - Agriculture, forestry, and fisheries
        - Animal and dairy science
        - Veterinary sciences
        - Agricultural biotechnology
        - Food and nutrition sciences
        - Psychology and cognitive sciences
        - Economics and Business administration
        - Education
        - Sociology
        - Law
        - Political sciences
        - Social and economic geography
        - Media and Communication sciences
        - Other social sciences
        - History and archaeology
        - Languages and literature
        - Philosophy, ethics and religion
        - Arts (arts, history of arts, performing arts, music)
        - Other humanities

  links:
    type: object
    additionalProperties: false
    required: [homepage]
    properties:
      homepage: {$ref: "#/$defs/url"}
      docs: {$ref: "#/$defs/url", description: "Main documentation, if different from the homepage"}
      download: {$ref: "#/$defs/url", description: "Only if not fetched (bio.tools download or GitHub releases)"}

  ids:
    description: >
      Registry identifiers; give whichever exist. They drive fetching and appear as Registry links.
      Keys follow the ELIXIR toolkit theme / RDMkit registry keys where they overlap.
    type: object
    additionalProperties: false
    properties:
      biotools: {type: string, description: "bio.tools ID; must resolve at https://bio.tools/api/<id>"}
      github: {type: string, pattern: "^[^/]+/[^/]+$", description: "owner/repo"}
      rsd: {type: string, description: "Research Software Directory slug"}
      fairsharing: {type: string, pattern: "^10\\.25504/FAIRsharing\\.", description: "FAIRsharing DOI"}
      doi: {type: string, pattern: "^10\\.", description: "DOI of a document, checklist or model"}

  # Values follow the bio.tools vocabularies, plus "Institutional licence". Fetched from bio.tools when
  # present; for open-source software they default to "Free of charge" and "Open access".
  cost: {enum: [Free of charge, Free of charge (with restrictions), Commercial, Institutional licence]}
  access: {enum: [Open access, Open access (with restrictions), Restricted access]}
  license: {type: string, description: "Only to override the fetched licence (SPDX identifier or Proprietary)"}
  maturity: {enum: [Emerging, Mature, Legacy], description: "Only to override bio.tools maturity"}
  how_to_cite: {type: string, description: "Only if not available from CITATION.cff or bio.tools"}

  institutes:
    description: Dutch institutes known to use it. Names must match _data/affiliations.yml.
    type: array
    items: {type: string}

  keywords:
    description: >
      Keywords from _data/keywords.yml: concrete standards, formats or artefacts a reader would search
      for (not generic activities). One shared list keeps spelling consistent; add new ones there first.
    type: array
    uniqueItems: true
    items:
      enum: [RDF, OWL, OBO format, SPARQL, SHACL, JSON-LD, DCAT, CSV, ontology, codebook, eCRF]

  related:
    description: ids of related catalogue entries; shown as Related tools.
    type: array
    items: {type: string}

$defs:
  url: {type: string, format: uri}
